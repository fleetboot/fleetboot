# Disable the magic SysRq key by default for the fleet.
#
# Two reasons:
#   1. Hardware safety: a floating ttyS0 (serial-console enabled in
#      grub but no cable connected) picks up electrical noise that
#      the kernel interprets as SysRq sequences. We've seen this
#      cause silent reboots on OptiPlex 780 hardware (sysrq:HELP +
#      'b' in dmesg → kernel.reboot).
#   2. Student safety: a school user on the physical keyboard can
#      otherwise hit Alt+SysRq+B to reboot the machine or
#      Alt+SysRq+E to nuke every running process. Neither is a
#      capability we want on shared lab hardware.
#
# An admin who needs SysRq for live diagnosis can re-enable it for a
# single session with `sysctl -w kernel.sysrq=1`.
kernel.sysrq = 0
