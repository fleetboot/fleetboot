# FreeIPA + Kerberos NFS enrolment config for the freeipa-desktop image.
# Read on first boot by /usr/local/lib/fleetboot/enroll-freeipa (shipped by
# the freeipa profile). Deployment-specific — this is the fleetboot host's
# realm at 192.168.25.13 (see the /etc/hosts entry in this same overlay).
IPA_REALM=FLEET.LAN
IPA_DOMAIN=fleet.lan
IPA_SERVER=ipa.fleet.lan
IPA_KEYTAB=/etc/fleetboot/enrol.keytab
IPA_NFS_SERVER=ipa.fleet.lan
# Enrol deterministically as this FQDN so it matches the host keytab minted
# for it (baked in as enrol.keytab in this overlay).
IPA_HOSTNAME=laptop.fleet.lan
