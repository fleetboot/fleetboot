#File modified by ipa-client-install

includedir /etc/krb5.conf.d/
[libdefaults]
  default_realm = FLEET.LAN
  dns_lookup_realm = false
  rdns = false
  dns_canonicalize_hostname = false
  dns_lookup_kdc = true
  ticket_lifetime = 24h
  forwardable = true
  udp_preference_limit = 0
  default_ccache_name = KEYRING:persistent:%{uid}


[realms]
  FLEET.LAN = {
    kdc = ipa.fleet.lan:88
    master_kdc = ipa.fleet.lan:88
    admin_server = ipa.fleet.lan:749
    kpasswd_server = ipa.fleet.lan:464
    default_domain = fleet.lan
    pkinit_anchors = FILE:/var/lib/ipa-client/pki/kdc-ca-bundle.pem
    pkinit_pool = FILE:/var/lib/ipa-client/pki/ca-bundle.pem

  }


[domain_realm]
  .fleet.lan = FLEET.LAN
  fleet.lan = FLEET.LAN
  laptop.fleet.lan = FLEET.LAN


