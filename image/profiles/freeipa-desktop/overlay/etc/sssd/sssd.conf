[domain/fleet.lan]

id_provider = ipa
ipa_server = _srv_, ipa.fleet.lan
ipa_domain = fleet.lan
ipa_hostname = laptop.fleet.lan
auth_provider = ipa
chpass_provider = ipa
access_provider = ipa
cache_credentials = True
ldap_tls_cacert = /etc/ipa/ca.crt
krb5_store_password_if_offline = True
[sssd]
services = nss, pam, ssh, sudo

domains = fleet.lan
[nss]
homedir_substring = /home

[pam]

[sudo]

[autofs]

[ssh]

[pac]

[ifp]

[session_recording]

