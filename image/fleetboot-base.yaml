# Fleetboot base image recipe (debos).
#
# Produces a netboot-ready squashfs that:
#   - boots Debian trixie userland,
#   - has the Fleetboot boot-state reporter installed and enabled,
#   - applies the four admin customisation points described in
#     custom/README.md without ever needing the admin to edit this file.
#
# Build with `make image` from the repository root. The fast structural tests
# under `make test` parse this recipe to confirm the wiring is intact.
#
# Template variables (all overridable with `debos --template-var=key:value`):
#   architecture  CPU arch for the produced image (default: amd64).
#   suite         Debian release codename (default: trixie).
#   mirror        Debian mirror URL.
#   output        Squashfs output filename (default: fleetboot-<arch>.squashfs).
#
# Inside the recipe, debos sets:
#   ${RECIPEDIR}    the directory holding this recipe file
#   ${ROOTDIR}      the image root under construction
#   ${ARTIFACTDIR}  where final artifacts (squashfs, kernel, initrd) land

{{ $architecture := or .architecture "amd64" }}
{{ $suite := or .suite "trixie" }}
{{ $mirror := or .mirror "http://deb.debian.org/debian" }}
{{ $profile := or .profile "default" }}
{{ $build_version := or .build_version "unspecified" }}
{{ $output := or .output (printf "fleetboot-%s-%s.squashfs" $profile $architecture) }}

architecture: {{ $architecture }}

actions:

  # ---------- base rootfs ----------

  - action: debootstrap
    description: "Bootstrap the Debian {{ $suite }} base rootfs"
    suite: {{ $suite }}
    mirror: {{ $mirror }}
    components:
      - main
    variant: minbase

  - action: apt
    description: "Install the core Fleetboot image packages"
    packages:
      # systemd is the boot/PID-1 we target
      - systemd
      - systemd-sysv
      # Python runtime for the boot-state reporter
      - python3
      - python3-httpx
      # live-boot turns the image into a netbootable squashfs root (initrd
      # support for fetching the squashfs and setting up the tmpfs overlay)
      - live-boot
      # kernel for the chosen architecture; the package name happens to match
      - linux-image-{{ $architecture }}
      # basic networking so the network_up trigger has something to ride on
      - ifupdown
      - isc-dhcp-client
      - iproute2
      # helpful for the smoke test
      - ca-certificates
      # FreeIPA-backed identity. sssd does the PAM/NSS lookups; freeipa-client
      # provides the enrolment tool (ipa-client-install) and the join logic.
      # libpam-sss / libnss-sss wire SSSD into the auth and name-resolution
      # stacks so logins via display-manager and ssh go through FreeIPA.
      - freeipa-client
      - sssd
      - sssd-ipa
      - libpam-sss
      - libnss-sss
      # Kerberos client + NFSv4. krb5-user gives us kinit/klist for
      # debugging; nfs-common pulls in idmapd and the rpc.gssd helpers that
      # NFSv4 with sec=krb5p needs to mount a home directory.
      - krb5-user
      - nfs-common
      # autofs lets us mount /home/<user> on demand, using the user's
      # Kerberos credential cache as the auth context.
      - autofs
      # No desktop, display manager, audio stack, or graphics drivers
      # in the base image. The default profile inherits this thin Debian
      # and adds nothing; desktop profiles (xfce-desktop, gnome-desktop,
      # kde-desktop, cinnamon-desktop) add the GUI; graphics profiles
      # (amd-graphics, nvidia-graphics) add vendor-specific stacks.
      # Real-world profiles like `school` chain a desktop into the mix:
      # `school` declares `parent: xfce-desktop` and adds LibreWolf on top.

  # ---------- admin customisation: pre-build hook ----------

  - action: run
    description: "Run admin pre-build hook if present"
    chroot: false
    command: |
      hook="${RECIPEDIR}/custom/hooks/pre-build"
      if [ -x "$hook" ]; then
        echo "fleetboot: running admin pre-build hook"
        ROOTDIR="$ROOTDIR" ARTIFACTDIR="$ARTIFACTDIR" "$hook"
      fi

  # ---------- Fleetboot reporter and triggers ----------

  - action: overlay
    description: "Install the Fleetboot reporter Python package"
    # The Makefile stages a copy of ../fleetboot here as image/fleetboot_pkg
    # so it sits inside the recipe directory, which fakemachine mounts into
    # its build VM. (Arbitrary host paths outside the recipe directory are
    # not visible inside fakemachine.)
    source: ./fleetboot_pkg
    destination: /usr/lib/python3/dist-packages/fleetboot

  - action: run
    description: "Stamp the image build version into /etc/fleetboot/build-version"
    chroot: true
    command: |
      mkdir -p /etc/fleetboot
      printf '%s\n' '{{ $build_version }}' > /etc/fleetboot/build-version
      chmod 0644 /etc/fleetboot/build-version

  - action: overlay
    description: "Install Fleetboot systemd boot-state units"
    source: ./systemd
    destination: /etc/systemd/system

  - action: overlay
    description: "Install Fleetboot runtime helpers (heartbeat etc.)"
    source: ./runtime
    destination: /usr/local/lib/fleetboot

  - action: run
    description: "Mark Fleetboot runtime helpers executable"
    chroot: true
    command: chmod 0755 /usr/local/lib/fleetboot/fleetboot-heartbeat.sh

  - action: overlay
    description: "Install Fleetboot PAM session hook"
    source: ./pam
    destination: /usr/local/lib/fleetboot

  - action: overlay
    description: "Install FreeIPA enrolment helper and NFS autofs map"
    source: ./identity
    destination: /usr/local/lib/fleetboot/identity

  - action: run
    description: "Wire identity assets into their canonical paths"
    chroot: true
    command: |
      install -m 0755 \
        /usr/local/lib/fleetboot/identity/enroll-freeipa \
        /usr/local/lib/fleetboot/enroll-freeipa
      install -m 0755 \
        /usr/local/lib/fleetboot/identity/fetch-keytab \
        /usr/local/lib/fleetboot/fetch-keytab
      install -m 0644 \
        /usr/local/lib/fleetboot/identity/fleetboot-freeipa-enroll.service \
        /etc/systemd/system/fleetboot-freeipa-enroll.service
      install -m 0644 \
        /usr/local/lib/fleetboot/identity/fleetboot-keytab-fetch.service \
        /etc/systemd/system/fleetboot-keytab-fetch.service
      install -m 0644 \
        /usr/local/lib/fleetboot/identity/auto.home \
        /etc/auto.home
      install -m 0644 \
        /usr/local/lib/fleetboot/identity/auto.shared \
        /etc/auto.shared
      # Point autofs at our maps. Skip lines that are already there so
      # admin overlays can override either map.
      if ! grep -q '^/home[[:space:]].*auto\.home' /etc/auto.master; then
        echo '/home /etc/auto.home --timeout=600' >> /etc/auto.master
      fi
      if ! grep -q '^/shared[[:space:]].*auto\.shared' /etc/auto.master; then
        echo '/shared /etc/auto.shared --timeout=600' >> /etc/auto.master
      fi
      # Enable the keytab-fetch and enrolment oneshots. The fetch unit's
      # ordering puts it Before=freeipa-enroll, so the keytab is in place
      # by the time enrolment runs.
      systemctl enable fleetboot-keytab-fetch.service
      systemctl enable fleetboot-freeipa-enroll.service
      systemctl enable autofs.service
      # Heartbeat timer keeps the dashboard's "latest state" column fresh
      # and lets fleetboot detect machines that went silent.
      systemctl enable fleetboot-heartbeat.timer

  - action: run
    description: "Enable the Fleetboot boot-state reporting units"
    chroot: true
    command: |
      systemctl enable fleetboot-network-up.service
      # nfs-mounted depends on the Kerberos NFS home.mount unit which only
      # comes online after the machine is enrolled with FreeIPA. Enable it
      # if it exists; the unit's own ordering keeps it silent otherwise.
      if systemctl list-unit-files home.mount >/dev/null 2>&1; then
        systemctl enable fleetboot-nfs-mounted.service
      fi
      # login-ready unit is enabled unconditionally. If the profile didn't
      # install a display manager, the unit's Requires=display-manager
      # will skip it — that's the right behaviour for headless profiles.
      systemctl enable fleetboot-login-ready.service
      # Thin default: boot to a text console. Desktop profiles flip this
      # to graphical.target from their setup-chroot.
      systemctl set-default multi-user.target

  - action: run
    description: "Wire the Fleetboot PAM session hook into common-session"
    chroot: true
    command: |
      hook_line='session optional pam_exec.so type=open_session /usr/local/lib/fleetboot/fleetboot-session-hook'
      if ! grep -qF "$hook_line" /etc/pam.d/common-session; then
        echo "$hook_line" >> /etc/pam.d/common-session
      fi

  # ---------- profile: built-in variant selected via PROFILE= ----------
  #
  # A profile lives at image/profiles/<name>/ and may carry an
  # extra-packages.list, an overlay/ tree, and an executable setup-chroot
  # script. The recipe applies them BEFORE the admin custom block so that
  # admin overrides win.

  - action: overlay
    description: "Stage the {{ $profile }} profile into the image"
    source: ./profiles_resolved/{{ $profile }}
    destination: /tmp/fleetboot-profile

  - action: run
    description: "Install profile-specified extra Debian packages"
    chroot: true
    command: |
      list=/tmp/fleetboot-profile/extra-packages.list
      if [ -s "$list" ]; then
        packages=$(grep -vE '^\s*(#|$)' "$list" || true)
        if [ -n "$packages" ]; then
          apt-get update
          apt-get install -y --no-install-recommends $packages
        fi
      fi

  - action: run
    description: "Apply the profile overlay tree on top of the image"
    chroot: false
    command: |
      src="${RECIPEDIR}/profiles/{{ $profile }}/overlay"
      if [ -d "$src" ] && [ -n "$(find "$src" -mindepth 1 -not -name .gitkeep -print -quit 2>/dev/null)" ]; then
        (cd "$src" && tar -cf - --exclude=.gitkeep .) | \
          (cd "$ROOTDIR" && tar -xf - --no-same-owner)
      fi

  - action: run
    description: "Run profile setup-chroot if present"
    chroot: true
    command: |
      script=/tmp/fleetboot-profile/setup-chroot
      if [ -x "$script" ]; then
        echo "fleetboot: running {{ $profile }} profile setup-chroot"
        "$script"
      fi

  - action: run
    description: "Remove the staged profile directory from the image"
    chroot: true
    command: rm -rf /tmp/fleetboot-profile

  # ---------- admin customisation: extra packages and overlay ----------

  - action: overlay
    description: "Stage admin extras into the image for the next step"
    source: ./custom
    destination: /tmp/fleetboot-custom

  - action: run
    description: "Install admin-specified extra Debian packages"
    chroot: true
    command: |
      list=/tmp/fleetboot-custom/extra-packages.list
      if [ -s "$list" ]; then
        packages=$(grep -vE '^\s*(#|$)' "$list" || true)
        if [ -n "$packages" ]; then
          apt-get update
          apt-get install -y --no-install-recommends $packages
        fi
      fi

  - action: run
    description: "Apply the admin overlay tree on top of the image"
    chroot: false
    command: |
      src="${RECIPEDIR}/custom/overlay"
      if [ -d "$src" ] && [ -n "$(find "$src" -mindepth 1 -not -name .gitkeep -print -quit)" ]; then
        # Copy preserving permissions; do not follow symlinks out of the tree.
        (cd "$src" && tar -cf - --exclude=.gitkeep .) | \
          (cd "$ROOTDIR" && tar -xf - --no-same-owner)
      fi

  - action: run
    description: "Run admin post-install hook if present"
    chroot: true
    command: |
      hook=/tmp/fleetboot-custom/hooks/post-install
      if [ -x "$hook" ]; then
        echo "fleetboot: running admin post-install hook"
        "$hook"
      fi

  - action: run
    description: "Remove the staged admin extras directory from the image"
    chroot: true
    command: rm -rf /tmp/fleetboot-custom

  # ---------- admin customisation: local.yaml extension ----------

  # If the admin dropped a local.yaml with extra debos actions, include it here.
  # The `recipe` action only runs if the file exists, so absence is fine.
  - action: run
    description: "Note whether the admin shipped a local.yaml extension"
    chroot: false
    command: |
      if [ -f "${RECIPEDIR}/custom/local.yaml" ]; then
        echo "fleetboot: admin local.yaml extension detected; including it"
      fi

  # ---------- admin customisation: post-build hook ----------

  - action: run
    description: "Run admin post-build hook if present"
    chroot: false
    command: |
      hook="${RECIPEDIR}/custom/hooks/post-build"
      if [ -x "$hook" ]; then
        echo "fleetboot: running admin post-build hook"
        ROOTDIR="$ROOTDIR" ARTIFACTDIR="$ARTIFACTDIR" "$hook"
      fi

  # ---------- artifacts: kernel, initrd, squashfs ----------

  - action: run
    description: "Copy kernel and initrd out of the image for netboot use"
    chroot: false
    command: |
      set -e
      vmlinuz=$(ls -1 "$ROOTDIR"/boot/vmlinuz-* | head -n1)
      initrd=$(ls -1 "$ROOTDIR"/boot/initrd.img-* | head -n1)
      cp "$vmlinuz" "$ARTIFACTDIR/vmlinuz"
      cp "$initrd"  "$ARTIFACTDIR/initrd.img"

  - action: run
    description: "Pack the rootfs as a squashfs"
    chroot: false
    command: |
      set -e
      out="$ARTIFACTDIR/{{ $output }}"
      rm -f "$out"
      mksquashfs "$ROOTDIR" "$out" \
        -comp xz -noappend -no-recovery -quiet \
        -e boot
