# Minimal project metadata so pytest discovers our package layout cleanly.

[project]
name = "fleetboot"
version = "0.0.1"
description = "Locked-down netboot fleet control plane for schools"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Functional tests cross into the sister tftpjail project; run them via
# `make functional-test`, not the default `make test`.
addopts = "-ra --ignore=tests/functional"
