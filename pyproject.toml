# Minimal project metadata so pytest discovers our package layout cleanly.

[project]
name = "fleetboot"
version = "0.0.1"
description = "Locked-down netboot fleet control plane for schools"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
# fleetboot/tftp_glue imports tftpjail (sibling repo); tftpjail is a
# pure-Python core that we use as a library, so adding it to the
# pytest pythonpath is enough for tests to import.
pythonpath = ["..", "../tftpjail"]
# Each non-default suite has its own `make` target:
#   make functional-test       — in-process fleetboot + tftpjail wire
#   make vbox-functional-test  — real VirtualBox UEFI guest
#   make qemu-functional-test  — libvirt-managed QEMU UEFI guest (preferred)
# None of these run under the default `make test`.
addopts = "-ra --ignore=tests/functional --ignore=tests/vbox_functional --ignore=tests/qemu_functional"
