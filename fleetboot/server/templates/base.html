<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}fleetboot{% endblock %}</title>
  <style>
    :root { --fg: #222; --muted: #666; --bg: #fafafa; --accent: #1f78b4;
            --bad: #c0392b; --good: #2e7d32; --border: #ddd; }
    * { box-sizing: border-box; }
    body { font-family: -apple-system, "Segoe UI", Helvetica, sans-serif;
           margin: 0; background: var(--bg); color: var(--fg);
           font-size: 15px; line-height: 1.4; }
    header { background: #222; color: #fff; padding: 12px 24px; }
    header a { color: #fff; text-decoration: none; margin-right: 18px; }
    header a:hover { text-decoration: underline; }
    header .title { font-weight: bold; margin-right: 28px; }
    main { padding: 16px 14px; max-width: 1400px; margin: 0 auto; }
    h1, h2 { font-weight: 600; }
    h1 { margin-top: 0; }
    table { width: 100%; border-collapse: collapse; margin: 12px 0; background: #fff; }
    th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--border); }
    th { background: #f0f0f0; font-weight: 600; font-size: 14px; }
    code, pre { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; }
    pre { background: #111; color: #eee; padding: 10px 12px; overflow-x: auto;
          border-radius: 4px; max-height: 600px; overflow-y: auto; }
    form { margin: 16px 0; }
    label { display: block; margin: 8px 0 4px 0; font-weight: 500; }
    input[type=text], input[type=password], select, textarea {
       padding: 6px 8px; font-size: 14px; border: 1px solid var(--border);
       border-radius: 3px; font-family: inherit; }
    textarea { width: 100%; font-family: ui-monospace, Menlo, Consolas, monospace; }
    button { padding: 6px 14px; font-size: 14px; cursor: pointer;
             background: var(--accent); color: #fff; border: 0; border-radius: 3px; }
    button.danger { background: var(--bad); }
    button:hover { opacity: 0.9; }
    .state-network_up { color: var(--accent); }
    .state-scratch_mounted { color: var(--accent); }
    .state-nfs_mounted { color: var(--accent); }
    .state-login_console { color: var(--good); font-weight: 600; }
    .state-running { color: var(--accent); }
    .state-succeeded { color: var(--good); }
    .state-failed { color: var(--bad); }
    .muted { color: var(--muted); font-size: 13px; }
    .version-current { color: var(--good); font-weight: 500; }
    .version-stale   { color: var(--bad); font-weight: 500; }
    .row-actions { white-space: nowrap; }
    .row-actions form { display: inline-block; margin: 0 2px 0 0; }
    .row-actions form:last-child { margin-right: 0; }
    /* Compact row-action buttons — smaller padding / font so the
       three-button stack fits without forcing the table wider. */
    .row-actions button {
       padding: 3px 8px; font-size: 12px; border-radius: 2px;
    }
  </style>
</head>
<body>
  <header>
    <span class="title">fleetboot</span>
    <a href="/dashboard">machines</a>
    <a href="/dashboard/events">events</a>
    <a href="/dashboard/auto-enrol-rules">rules</a>
    <a href="/dashboard/profiles">profiles</a>
    <a href="/dashboard/builds">builds</a>
    <a href="/dashboard/settings">settings</a>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <script>
  // Shared live-view helper. Pages that want to refresh in place set
  // `polling_seconds` in their template context and register a
  // page-specific apply function via startLiveView(url, applyFn).
  window.startLiveView = function(url, applyFn, intervalMs) {
    let inFlight = false;
    let failureStreak = 0;
    async function poll() {
      if (inFlight) return;
      inFlight = true;
      try {
        const r = await fetch(url, {
          credentials: 'same-origin',
          headers: { 'Accept': 'application/json' },
        });
        if (!r.ok) throw new Error('HTTP ' + r.status);
        applyFn(await r.json());
        failureStreak = 0;
      } catch (e) {
        failureStreak++;
        // Prolonged failure = probably auth expired / network gone;
        // fall back to a full reload so the basic-auth prompt or a
        // clearer error page reappears.
        if (failureStreak >= 5) window.location.reload();
      } finally {
        inFlight = false;
      }
    }
    poll();
    setInterval(poll, intervalMs);
  };
  window.escapeHtml = function(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  };
  </script>
  {% block live_view %}{% endblock %}
</body>
</html>
